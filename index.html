<!DOCTYPE html>
<html lang="ko" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <!-- No user-scalable=no: it never worked on iOS (ignored since iOS 10) and
         broke pinch-zoom accessibility. Zoom-on-focus is fixed at the CSS layer. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>STUDIO (WXZ) · 정찬봉 — 시각 디자이너 · 사진가</title>
    <meta
      name="description"
      content="정찬봉 (郑灿峰) — 13년차 시각 디자이너 · 사진가. 브랜드 비주얼, 상업 영상, 생성형 AI 워크플로. 신세계면세점 · 아모레퍼시픽 파트너."
    />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050505'/%3E%3Cpath d='M42 14v14h9v7L30 51V36h-9v-8z' fill='%23fafafa'/%3E%3C/svg%3E" />

    <!-- Home-screen identity: iOS picks these up on 共享 → 保存到桌面.
         Without them iOS falls back to a generated letter tile (the "S"). -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Canfeng" />
    <meta name="application-name" content="Canfeng" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#050505" />

    <!-- Primary UI face: Montserrat (Latin) over Spoqa Han Sans Neo (Hangul) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/spoqa/spoqa-han-sans/css/SpoqaHanSansNeo.css"
    />
  </head>
  <body class="bg-ink text-paper antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
